# Brave Search API — authored for the ColdSearch gateway on 2026-11-27.
#
# Brave publishes no full API document. Its only one,
# https://search.agent.s.brave.app/openapi.json, lists 8 GET operations with a
# reduced parameter set. This file covers the 16 operations of the reference
# pages indexed at https://api-dashboard.search.brave.com/llms.txt: names,
# types, ranges and defaults are the ones those pages state, descriptions are
# shortened, and value lists longer than 12 entries (countries, languages) are
# left to the description. Each operation names its page. No operation here
# was run with a key.
#
# Left out on purpose: the key header (the gateway sends it), Accept and
# User-Agent (the gateway sets them), the deprecated goggles_id, and the
# metadata and seed fields the Answers page says are ignored.
#
# Each Brave plan (Search, Answers, Autosuggest, Spellcheck) issues its own
# key, so one upstream reaches one plan's operations: the `brave` preset hides
# answers, suggest and spellcheck, and `braveanswers` offers answers alone.
openapi: 3.1.0
info:
  title: Brave Search API (authored for ColdSearch)
  version: "2026-11-27"
  description: Written from Brave's reference pages; not a vendor document.
servers:
  - url: https://api.search.brave.com
security:
  - subscriptionToken: []
paths:
  /res/v1/web/search:
    get:
      operationId: webSearch
      summary: Search
      description: "Search the web from a large independent index of web pages. Search plan. Source:
        https://api-dashboard.search.brave.com/api-reference/web/search/get/index.html.md, read 2026-11-27.
        This operation is unverified against the live API."
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            description: The user's search query term. Query can not be empty. Maximum of 600 characters and 75 words in
              the query.
        - name: country
          in: query
          schema:
            type: string
            default: US
            description: The 2 character country code where the search results come from.
        - name: search_lang
          in: query
          schema:
            type: string
            default: en
            description: The 2 or more character language code for which the search results are provided.
        - name: ui_lang
          in: query
          schema:
            type: string
            default: en-US
            description: User interface language preferred in response. Usually of the format
              <language_code>-<country_code>. For more, see RFC 9110.
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
            description: "The number of search results returned in response. The maximum is 20. The actual number
              delivered may be less than requested. Combine this parameter with offset to paginate search
              results. NOTE: Count only applies to web results."
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9
            default: 0
            description: The zero based offset that indicates number of search result pages (count) to skip before
              returning the result. The default is 0 and the maximum is 9. The actual number delivered may be
              less than requested.
        - name: safesearch
          in: query
          schema:
            type: string
            enum:
              - off
              - moderate
              - strict
            default: moderate
            description: "Filters search results for adult content. The following values are supported: - off - No
              filtering is done. - moderate - Filters explicit content, like images and videos, but allows
              adult domains in the search results."
        - name: spellcheck
          in: query
          schema:
            type: boolean
            default: true
            description: Whether to spell check provided query. If the spell checker is enabled, the modified query is
              always used for search. The modified query can be found in altered key from the query response
              model.
        - name: freshness
          in: query
          schema:
            type: string
            description: "Filters search results by page age. The age of a page is determined by the most relevant date
              reported by the content, such as its published or last modified date. The following values are
              supported: - pd - Pages aged 24 hours or less."
        - name: text_decorations
          in: query
          schema:
            type: boolean
            default: true
            description: Whether display strings (e.g. result snippets) should include decoration markers (e.g.
              highlighting characters).
        - name: result_filter
          in: query
          schema:
            type: string
            description: A comma delimited string of result types to include in the search response. Not specifying this
              parameter will return back all result types in search response where data is available and the
              plan has the corresponding option activated.
        - name: units
          in: query
          schema:
            type: string
            enum:
              - imperial
              - metric
            description: "The measurement units. The following values are supported: - metric - The standardized
              measurement system (km, celcius..) - imperial - The British Imperial system of units (mile,
              fahrenheit..)"
        - name: goggles
          in: query
          schema:
            type: string
            description: Goggles act as a custom re-ranking on top of Brave's search index. The parameter supports both a
              url where the Goggle is hosted or the definition of the Goggle. For more details, see the
              Goggles documentation.
        - name: extra_snippets
          in: query
          schema:
            type: string
            description: A snippet is an excerpt from a page you get as a result of the query, and extra_snippets allow
              you to get up to 5 additional, alternative excerpts.
        - name: summary
          in: query
          schema:
            type: string
            description: This parameter enables summary key generation in web search results. This is required for
              summarizer to be enabled.
        - name: enable_rich_callback
          in: query
          schema:
            type: boolean
            default: false
            description: "Enable rich callback. Allows you to get real time rich results via a callback URL when they are
              relevant to your query. NOTE: Requires `Search` plan."
        - name: include_fetch_metadata
          in: query
          schema:
            type: boolean
            default: false
            description: Include fetch metadata.
        - name: operators
          in: query
          schema:
            type: boolean
            default: true
            description: Whether to apply search operators
        - name: operators_fallback
          in: query
          schema:
            type: boolean
            default: false
            description: Whether to try relaxed operator matching first, falling back to the original results if no
              matches succeed
        - name: X-Loc-Lat
          in: header
          schema:
            type: string
            description: The latitude of the client's geographical location in degrees, to provide relevant local results.
              The latitude must be greater than or equal to -90.0 degrees and less than or equal to +90.0
              degrees. Range -90 to 90.
        - name: X-Loc-Long
          in: header
          schema:
            type: string
            description: The longitude of the client's geographical location in degrees, to provide relevant local
              results. The longitude must be greater than or equal to -180.0 and less than or equal to +180.0
              degrees. Range -180 to 180.
        - name: X-Loc-Timezone
          in: header
          schema:
            type: string
            description: The IANA timezone for the client's device. For complete list of IANA timezones and location
              mappings see IANA Database and Geonames Database.
        - name: X-Loc-City
          in: header
          schema:
            type: string
            description: The generic name of the client city.
        - name: X-Loc-State
          in: header
          schema:
            type: string
            description: A code which could be up to three characters, that represent the client's state/region. The
              region is the first-level subdivision (the broadest or least specific) of the ISO 3166-2 code.
        - name: X-Loc-State-Name
          in: header
          schema:
            type: string
            description: The name of the client's state/region. The region is the first-level subdivision (the broadest or
              least specific) of the ISO 3166-2 code.
        - name: X-Loc-Country
          in: header
          schema:
            type: string
            description: The two letter country code for the client's country. For a list of country codes, see ISO 3166-1
              alpha-2.
        - name: X-Loc-Postal-Code
          in: header
          schema:
            type: string
            description: The client's postal code.
        - name: Api-Version
          in: header
          schema:
            type: string
            description: The API version to use. This is denoted by the format `YYYY-MM-DD`. Default is the latest that is
              available. Read more about API versioning.
        - name: Cache-Control
          in: header
          schema:
            type: string
            enum:
              - no-cache
            description: Brave Search will return cached content by default. To prevent caching set the Cache-Control
              header to `no-cache`. This is currently done as best effort.
      responses:
        "200":
          $ref: "#/components/responses/Results"
    post:
      operationId: webSearchPost
      summary: Search (JSON body)
      description: "Search the web from a large independent index of web pages. Search plan. Source:
