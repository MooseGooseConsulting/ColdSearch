  /res/v1/chat/completions:
    post:
      operationId: answers
      summary: Answers
      description: "API for AI-generated answers backed by real-time web search and verifiable sources. Answers
        plan: needs that plan's own key; billed per query plus input and output tokens. stream defaults to
        true, so the answer arrives as an event stream unless stream is false. Source:
        https://api-dashboard.search.brave.com/api-reference/ai/answers/index.html.md, read 2026-11-27. This
        operation is unverified against the live API."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                          - user
                        default: user
                      content:
                        type: string
                    required:
                      - content
                  description: 'The conversation so far. Exactly one `user` message is supported, e.g. `[{"role": "user",
                    "content": "Explain quantum computing"}]`.'
                model:
                  type: string
                  enum:
                    - brave-pro
                    - brave
                  default: brave-pro
                  description: Model ID used to generate the response.
                max_completion_tokens:
                  type: integer
                stream:
                  type: boolean
                  default: true
                web_search_options:
                  type: object
                  properties:
                    search_context_size:
                      type: string
                      enum:
                        - low
                        - medium
                        - high
                    user_location:
                      type: object
                      properties:
                        approximate:
                          type: object
                          properties:
                            city:
                              type: string
                            country:
                              type: string
                            region:
                              type: string
                            timezone:
                              type: string
                        type:
                          type: string
                          enum:
                            - approximate
                          default: approximate
                      required:
                        - approximate
                country:
                  type: string
                  default: us
                language:
                  type: string
                  default: en
                safesearch:
                  type: string
                  default: moderate
                enable_entities:
                  type: boolean
                  default: false
                  description: Whether to include inline entity tags in the answer. Requires `stream=true` and is not supported
                    in research mode.
                enable_citations:
                  type: boolean
                  default: false
                  description: Whether to include inline citation tags in the answer. Requires `stream=true` and is not
                    supported in research mode.
                enable_research:
                  type: boolean
                  default: false
                  description: Whether to answer with iterative deep research instead of a single search. Requires
                    `stream=true`.
                research_allow_thinking:
                  type: boolean
                  default: true
                  description: Accepted for compatibility. Ignored by the mixer engine behind this API, which always runs
                    research with extended thinking off.
                research_maximum_number_of_tokens_per_query:
                  type: integer
                  minimum: 1024
                  maximum: 16384
                  default: 8192
                  description: Maximum number of tokens to gather per research query.
                research_maximum_number_of_queries:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 20
                  description: Maximum number of search queries research mode may issue in total.
                research_maximum_number_of_iterations:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 4
                  description: Maximum number of research iterations.
                research_maximum_number_of_seconds:
                  type: integer
                  minimum: 1
                  maximum: 300
                  default: 180
                  description: Time budget for research, in seconds.
                research_maximum_number_of_results_per_query:
                  type: integer
                  minimum: 1
                  maximum: 60
                  default: 30
                  description: Maximum number of search results to consider per research query.
              required:
                - messages
      responses:
        "200":
          description: An OpenAI chat completion, or an event stream of completion chunks when stream is true.
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
components:
  securitySchemes:
    subscriptionToken:
      type: apiKey
      in: header
      name: X-Subscription-Token
  responses:
    Results:
      description: JSON result. Errors use
        {"type":"ErrorResponse","error":{"id","status","code","detail","meta"},"time"}; a rejected key is HTTP
        422 with code SUBSCRIPTION_TOKEN_INVALID.
      content:
        application/json:
          schema:
            type: object
