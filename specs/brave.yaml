        - name: lang
          in: query
          schema:
            type: string
            default: en
            description: The suggest search language preference, where potentially the results could come from. The 2 or
              more character language code for which the suggest search results are provided. This is a just a
              hint for calculating suggest responses.
        - name: country
          in: query
          schema:
            type: string
            default: US
            description: The suggest search query country, where potentially the results could come from. The country
