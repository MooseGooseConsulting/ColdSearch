  /res/v1/llm/context:
    get:
      operationId: llmContext
      summary: LLM Context
      description: "Pre-extracted web content optimized for AI agents, LLM grounding, and RAG pipelines. Use this
        API to get the context for your LLM or AI agent. Search plan. Source:
        https://api-dashboard.search.brave.com/api-reference/ai/llm_context/get/index.html.md, read
        2026-11-27. This operation is unverified against the live API."
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            description: The user's search query term. Query can not be empty. Maximum of 600 characters and 75 words in
              the query.
        - name: country
          in: query
          schema:
            type: string
            default: US
            description: The search query country, where the results come from. The country string is limited to 2
              character country codes of supported countries.
        - name: search_lang
          in: query
          schema:
            type: string
            default: en
            description: The search language preference. The 2 or more character language code for which the search
              results are provided.
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            description: The maximum number of search results considered to select the LLM context data. The default is 20
              and the maximum is 50.
        - name: safesearch
          in: query
          schema:
            type: string
            enum:
              - off
              - moderate
              - strict
            description: "Filters results for adult content. The following values are supported: - off - No filtering is
              done. - moderate - Drops adult content from the results used for context. - strict - Drops all
              adult content from the results used for context."
        - name: spellcheck
          in: query
          schema:
            type: boolean
            default: true
            description: Whether to enable spellcheck on the query.
        - name: operators
          in: query
          schema:
            type: boolean
            default: true
            description: Whether to apply search operators.
        - name: operators_fallback
          in: query
          schema:
            type: boolean
            default: true
            description: Whether to try relaxed operator matching first, falling back to the original results if no
              matches succeed.
        - name: maximum_number_of_urls
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            description: Maximum number of different URLs to include in LLM context.
        - name: maximum_number_of_tokens
          in: query
          schema:
            type: integer
            minimum: 1024
            maximum: 32768
            default: 8192
            description: Approximate maximum number of tokens to include in context. The default is `8192` and maximum is
              `32768`.
        - name: context_threshold_mode
          in: query
          schema:
            type: string
            enum:
              - disabled
              - strict
              - lenient
              - balanced
            description: The mode to use to determine the threshold for including content in context.
        - name: maximum_number_of_tokens_per_url
          in: query
          schema:
            type: integer
            minimum: 512
            maximum: 8192
            description: Maximum number of tokens to include per URL. The default is `4096` and maximum is `8192`.
        - name: goggles
          in: query
          schema:
            type: string
            description: Goggles act as a custom re-ranking on top of Brave's search index. The parameter supports both a
              url where the Goggle is hosted or the definition of the Goggle. For more details, see the
              Goggles documentation.
        - name: freshness
          in: query
          schema:
            type: string
            description: "Filters search results by page age. The age of a page is determined by the most relevant date
              reported by the content, such as its published or last modified date. The following values are
              supported: - pd - Pages aged 24 hours or less."
        - name: enable_local
          in: query
          schema:
            type: string
            description: "Whether to enable local recall. Not setting this value means auto-detect: local recall is used
              if a location is provided (`X-Loc-Lat` with `X-Loc-Long`, or `X-Loc-City`)."
        - name: enable_source_metadata
          in: query
          schema:
            type: boolean
            default: false
            description: Enable source metadata enrichment (site_name, favicon, thumbnail, description,
              fetched_content_timestamp) in the sources attribute of the response.
        - name: X-Loc-Lat
          in: header
          schema:
            type: string
            description: The latitude of the client's geographical location in degrees, to provide relevant local results.
              The latitude must be greater than or equal to -90.0 degrees and less than or equal to +90.0
              degrees. Range -90 to 90.
        - name: X-Loc-Long
          in: header
          schema:
            type: string
            description: The longitude of the client's geographical location in degrees, to provide relevant local
              results. The longitude must be greater than or equal to -180.0 and less than or equal to +180.0
              degrees. Range -180 to 180.
        - name: X-Loc-City
          in: header
          schema:
            type: string
            description: The generic name of the client city
        - name: X-Loc-State
          in: header
          schema:
            type: string
            description: A code which could be up to three characters, that represent the client's state/region. The
              region is the first-level subdivision (the broadest or least specific) of the ISO 3166-2 code.
        - name: X-Loc-State-Name
          in: header
          schema:
            type: string
            description: The name of the client's state/region. The region is the first-level subdivision (the broadest or
              least specific) of the ISO 3166-2 code.
        - name: X-Loc-Country
          in: header
          schema:
            type: string
            description: The two letter country code for the client's country. For a list of country codes, see ISO 3166-1
              alpha-2
        - name: X-Loc-Postal-Code
          in: header
          schema:
            type: string
            description: The client's postal code
        - name: Api-Version
          in: header
          schema:
            type: string
            description: The API version to use. This is denoted by the format `YYYY-MM-DD`. Default is the latest that is
              available. Read more about API versioning.
        - name: Cache-Control
          in: header
          schema:
            type: string
            enum:
              - no-cache
            description: Brave Search will return cached content by default. To prevent caching set the Cache-Control
              header to `no-cache`. This is currently done as best effort.
      responses:
        "200":
          $ref: "#/components/responses/Results"
