services:
  searxng:
    container_name: searxng
    image: searxng/searxng:latest@sha256:d81e14a4328ba7a57f297dff0472be629d30bf29580406c0d5b3bdab563c9bed
    ports:
      - "8889:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
