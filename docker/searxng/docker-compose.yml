services:
  searxng:
    container_name: searxng
    image: searxng/searxng:latest@sha256:892ed5710603e38f9dc201e6a0b2f3f14dbdb8108edcadac30e55b165c979fb7
    ports:
      - "8889:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
