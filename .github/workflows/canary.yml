name: Canary (live providers)

# Live smoke test against real provider APIs — complements the offline unit suite
# in ci.yml, which mocks fetch and therefore cannot catch provider API drift.
#
# Runs on a schedule and on manual dispatch only — never on push/PR — so it does
# not gate merges. scripts/smoke.mjs always exercises the keyless Jina path and
# adds keyed providers when the matching secret is configured, so this job is
# green even with zero secrets set.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

# Prevent overlapping scheduled/manual runs from generating redundant provider traffic.
concurrency:
  group: canary-live-providers
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); trailing comment tracks the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Live smoke test
        run: node scripts/smoke.mjs
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
