name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  ci:
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-linux' }}
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); trailing comment tracks the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Docs sync checks
        run: npm run test:docs

      - name: Test
        run: npm test
